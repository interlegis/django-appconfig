{% extends "admin/base_site.html" %}
{% load i18n %}

{% block extrastyle %}
  {{ block.super }}
  {{ form.media.css }}
{% endblock %}

{% block content %}
  <form method="POST" action="" {% if form.is_multipart %}enctype="multipart/form-data"{% endif %}>{% csrf_token %}
    {{ form }}
    <div class="submit-row">
      <input type="submit" class="btn btn-primary default" value="Save" name="_save">
      <input type="submit" class="btn btn-secondary" value="Save and continue editing" name="_continue">
    </div>
  </form>
{% endblock %}
